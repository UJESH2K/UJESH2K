<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="ujesh.in landing page preview" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>ujesh.in</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5a1f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="page"><rect x="0" y="44" width="960" height="476"/></clipPath>
    <clipPath id="band"><rect x="0" y="424" width="960" height="34"/></clipPath>
    <clipPath id="card"><rect x="0" y="0" width="960" height="520" rx="14"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .r { opacity: 0; animation: rise 1s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: translateY(0); } }
    .ticker { animation: tick 38s linear infinite; }
    @keyframes tick { to { transform: translateX(-2100px); } }
    .grow { transform-box: fill-box; transform-origin: 0 50%; animation: grow 5s ease-in-out infinite; }
    @keyframes grow { 0% { transform: scaleX(0); } 70%, 100% { transform: scaleX(1); } }
    .pulse { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .25; } }
    .bob { animation: bob 1.6s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(6px); } }
    .drift { animation: drift 9s ease-in-out infinite; }
    @keyframes drift { 50% { transform: translate(-120px, 50px); } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <g clip-path="url(#card)">
    <!-- page -->
    <rect width="960" height="520" fill="#080808"/>
    <rect x="0.5" y="0.5" width="959" height="519" rx="14" fill="none" stroke="#242424"/>

    <!-- orange glow -->
    <g clip-path="url(#page)">
      <circle class="drift" cx="760" cy="240" r="260" fill="url(#glow)"/>
    </g>

    <!-- browser chrome -->
    <rect width="960" height="44" fill="#111"/>
    <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
    <circle cx="44" cy="22" r="6" fill="#febc2e"/>
    <circle cx="64" cy="22" r="6" fill="#28c840"/>
    <rect x="300" y="10" width="360" height="24" rx="12" fill="#1c1c1c"/>
    <circle cx="322" cy="22" r="4" fill="#28c840"/>
    <text class="mono" x="336" y="26.5" font-size="13" fill="#cfcfcf">ujesh.in</text>
    <circle class="pulse" cx="838" cy="22" r="4" fill="#00e676"/>
    <text class="mono" x="848" y="26" font-size="11" fill="#00e676" letter-spacing="2">LIVE</text>

    <!-- site nav -->
    <g class="mono" font-size="11" fill="#7d7d7d" letter-spacing="1.5">
      <text x="60" y="80" fill="#f2f2f2">UJESH YADAV®</text>
      <text x="470" y="80">INTERNSHIPS</text>
      <text x="570" y="80">WORK</text>
      <text x="625" y="80">WINS</text>
      <text x="680" y="80">RESEARCH</text>
      <text x="765" y="80">CONTACT</text>
      <text x="850" y="80" fill="#ff5a1f">01/07</text>
    </g>

    <!-- eyebrow -->
    <text class="mono r" style="animation-delay:.2s" x="60" y="124" font-size="12" fill="#8a8a8a" letter-spacing="2.5">UJESH KUMAR YADAV · SOFTWARE ENGINEER · BENGALURU</text>

    <!-- headline -->
    <text class="r" style="animation-delay:.5s" x="58" y="196" font-size="66" font-weight="600" fill="#f2f2f2" letter-spacing="-2">Hello there,</text>
    <text class="r" style="animation-delay:.9s" x="58" y="268" font-size="66" font-weight="600" fill="#ff5a1f" letter-spacing="-2">I'm Ujesh.</text>
    <rect class="blink" x="372" y="224" width="5" height="48" fill="#ff5a1f"/>

    <!-- sub -->
    <g class="r" style="animation-delay:1.4s" font-size="17" fill="#b5b5b5">
      <text x="60" y="312">Software engineer building production web apps, applied AI</text>
      <text x="60" y="338">and distributed GPU systems, end to end.</text>
    </g>

    <!-- stats -->
    <g class="r" style="animation-delay:1.8s">
      <text x="60" y="392" font-size="36" font-weight="600" fill="#f2f2f2">7<tspan fill="#ff5a1f">×</tspan></text>
      <text class="mono" x="60" y="410" font-size="10" fill="#7d7d7d" letter-spacing="1.5">HACKATHON WINS</text>
      <text x="270" y="392" font-size="36" font-weight="600" fill="#f2f2f2">20<tspan fill="#ff5a1f">×</tspan></text>
      <text class="mono" x="270" y="410" font-size="10" fill="#7d7d7d" letter-spacing="1.5">NATIONAL FINALS</text>
      <text x="480" y="392" font-size="36" font-weight="600" fill="#f2f2f2">50<tspan fill="#ff5a1f">+</tspan></text>
      <text class="mono" x="480" y="410" font-size="10" fill="#7d7d7d" letter-spacing="1.5">HACKATHONS ENTERED</text>
      <text x="720" y="392" font-size="36" font-weight="600" fill="#f2f2f2">65<tspan fill="#ff5a1f">+</tspan></text>
      <text class="mono" x="720" y="410" font-size="10" fill="#7d7d7d" letter-spacing="1.5">PUBLIC PROJECTS</text>
    </g>

    <!-- scroll cue -->
    <g class="r" style="animation-delay:2.2s">
      <g class="bob">
        <text class="mono" x="770" y="338" font-size="11" fill="#ff5a1f" letter-spacing="2">SCROLL TO EXPLORE ↓</text>
      </g>
    </g>

    <!-- ticker band -->
    <line x1="0" y1="424" x2="960" y2="424" stroke="#1e1e1e"/>
    <line x1="0" y1="458" x2="960" y2="458" stroke="#1e1e1e"/>
    <g clip-path="url(#band)">
      <g class="ticker">
        <text class="mono" x="0" y="446" font-size="14" fill="#cfcfcf" textLength="2100" lengthAdjust="spacing" xml:space="preserve">EaseMed · Internship  ✳  Edactly · Freelance  ✳  Hitachi · ML Intern  ✳  AICTE × Microsoft &amp; SAP  ✳  Inception · Winner  ✳  Denova · Winner  ✳  Cardano · Winner  ✳  Cypher 1 &amp; 3 · Winner ×2  ✳  IMPACT-2027 · Paper accepted  ✳  LitmusChaos · Open source  ✳  SIH · College rank 1  ✳  </text>
        <text class="mono" x="2100" y="446" font-size="14" fill="#cfcfcf" textLength="2100" lengthAdjust="spacing" xml:space="preserve">EaseMed · Internship  ✳  Edactly · Freelance  ✳  Hitachi · ML Intern  ✳  AICTE × Microsoft &amp; SAP  ✳  Inception · Winner  ✳  Denova · Winner  ✳  Cardano · Winner  ✳  Cypher 1 &amp; 3 · Winner ×2  ✳  IMPACT-2027 · Paper accepted  ✳  LitmusChaos · Open source  ✳  SIH · College rank 1  ✳  </text>
      </g>
    </g>

    <!-- footer progress line -->
    <text class="mono" x="60" y="494" font-size="10" fill="#7d7d7d" letter-spacing="2">UJESH YADAV</text>
    <rect x="170" y="489.5" width="600" height="1" fill="#242424"/>
    <rect class="grow" x="170" y="489" width="600" height="2" fill="#ff5a1f"/>
    <text class="mono" x="790" y="494" font-size="10" fill="#7d7d7d" letter-spacing="2">008</text>
    <text class="mono" x="840" y="494" font-size="10" fill="#7d7d7d" letter-spacing="1">CLICK TO OPEN ↗</text>
  </g>
</svg>
