
name: Build README assets
on:
  push:
    branches: [main]
    paths: ["scripts/**", "assets/robot-sprite.webp", "assets/font.woff2", ".github/workflows/readme-assets.yml"]
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_assets.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "chore: rebuild README assets" && git push)
